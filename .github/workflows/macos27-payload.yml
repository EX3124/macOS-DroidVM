name: macos27-payload

# Builds the macOS 27 kernel payload on a GitHub-hosted macOS runner, from public sources only:
#
#   xnu-12377.121.6 + patches/xnu-12377  ->  k27 kernel (arm64e, 4 KiB, kc27 segment layout)
#   native kexts (NativeVirtioBlock, NativeRamBlock, NativeAES)
#   kernel collection (the 27 kernelcache kexts + our kernel + our kexts)
#
# There is no uploaded bundle and no developer tree: ci/harness/fetch.sh pulls the pinned public sources, the KDK and
# the UniXNU harness scripts; ci/harness/fetch-kernelcache.sh reads the 27 kernelcache out of the IPSW with HTTP ranges.
# Everything lands in the paths the k27 scripts already use (out/x12377, out/k27, out/kc).
#
# The boot disk itself (boot.img) is the next stage: it needs a Data seed built from the IPSW (make-macos-disk.py) and
# a trust cache; both are generated inputs, not uploaded ones. Until that stage lands this workflow publishes the
# payload (kernel-k27.macho, kc-k27.bin) as artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: macOS profile (configs/macos-<tag>-*.json, artifacts/TAG)
        default: '27.2'
      kexts:
        description: extra kexts to link (space separated - display video audio gpu input ethernet)
        default: ''
      runner:
        description: runner image (the Xcode 27 preview image is labelled xcode-27)
        default: 'xcode-27'
      xcode:
        description: Xcode application (empty = the newest Xcode 27 on the image)
        default: ''
      kdk_url:
        description: KDK disk image URL (dortania/KdkSupportPkg); empty = rely on the Xcode SDK headers
        default: ''
      kdk_sha256:
        description: KDK disk image SHA-256 (required with kdk_url)
        default: ''
      publish:
        description: publish the payload to the macos27-payload release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos27-payload
  cancel-in-progress: false

jobs:
  payload:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      MACOS_TAG: ${{ inputs.tag }}
      K27_KEXTS: ${{ inputs.kexts }}
      KDK_URL: ${{ inputs.kdk_url }}
      KDK_SHA256: ${{ inputs.kdk_sha256 }}
      JOBS: 6
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 27
        # The Xcode 27 preview image is `xcode-27` (macOS 27.0.1, Xcode 27.0/27.1/27.2). Select the newest 27.x
        # unless the caller names one; Xcode.app alone may point at 27.1.
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.xcode }}" ]; then
            sudo xcode-select -s "${{ inputs.xcode }}"
          else
            app=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$app" ]; then sudo xcode-select -s "$app"; fi
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -f iig || true
          xcrun -f mig || true
          # k27/try.sh calls llvm-nm unversioned; Xcode ships it in the toolchain.
          nmtool=$(xcrun -f llvm-nm 2>/dev/null || true)
          if [ -n "$nmtool" ]; then sudo ln -sf "$nmtool" /usr/local/bin/llvm-nm; fi

      - name: Host tools
        run: |
          set -euo pipefail
          brew install cmake ninja unifdef mtools gnu-sed
          # unifdef is keg-only on Homebrew; the fakeroot step runs it from PATH.
          echo "/opt/homebrew/opt/unifdef/bin" >> "$GITHUB_PATH"
          # xnu's header export tool invokes GNU-style `sed -i 's/.../' file`, which BSD sed rejects
          # ("invalid command code I"); GNU sed must come first.
          echo "/opt/homebrew/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          # The runner's python3 is externally managed (PEP 668): pyimg4 lives in its own venv, and
          # ci/harness/fetch-kernelcache.sh uses K27_PYTHON for it.
          python3 -m venv "$RUNNER_TEMP/pyimg4"
          "$RUNNER_TEMP/pyimg4/bin/python" -m pip install --upgrade pip pyimg4
          echo "K27_PYTHON=$RUNNER_TEMP/pyimg4/bin/python" >> "$GITHUB_ENV"

      - name: Pinned sources (UniXNU, UniXNU-droidvm, tools)
        # scripts/prepare-sources.py materializes sources/ from configs/sources.lock.json with submodules.
        run: python3 scripts/prepare-sources.py

      - name: Cache KDK download
        # The KDK disk image is 1.2 GB; cache the download (ci/harness/fetch.sh verifies its SHA-256 on use).
        uses: actions/cache@v4
        with:
          path: out/tmp/kdk
          key: kdk-25F84

      - name: Cache ld64 build
        uses: actions/cache@v4
        with:
          path: out/harness/ld64
          key: ld64-711-arm64

      - name: Public harness inputs (xnu + patches, KDK, libplatform/libdispatch, UniXNU scripts)
        run: bash ci/harness/fetch.sh

      - name: macOS 27 kernelcache
        run: bash ci/harness/fetch-kernelcache.sh

      - name: Kernel, native kexts and kernel collection
        run: bash ci/k27-build.sh all

      - name: DarwinBoot.efi
        # GunyahBootPkg is derived from the public edk2-gunyah GunyahPkg by ci/darwinboot/make-gunyah-boot.py;
        # DarwinBootPkg itself comes from sources/UniXNU/drivers/DarwinBoot (prepare-sources).
        run: |
          set -euo pipefail
          make -C sources/edk2/BaseTools -j"$(sysctl -n hw.ncpu)"
          mkdir -p artifacts/boot-inputs
          [ -s artifacts/boot-inputs/provenance.json ] || echo '{}' > artifacts/boot-inputs/provenance.json
          python3 scripts/build-darwinboot.py
          ls -la artifacts/boot-inputs/DarwinBoot.efi

      - name: Collect
        if: always()
        run: |
          mkdir -p collect
          cp out/k27/kernel-k27.macho out/k27/kc-k27.bin out/k27/kc-k27.natives.json collect/ 2>/dev/null || true
          cp out/k27/kc-build.log collect/ 2>/dev/null || true
          cp out/kc/kc27.bin collect/kc27.bin 2>/dev/null || true
          cp artifacts/boot-inputs/DarwinBoot.efi collect/ 2>/dev/null || true
          sha256sum collect/* 2>/dev/null || true
          ls -la collect

      - name: Upload payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-payload-${{ inputs.tag }}
          path: collect/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Publish payload
        if: inputs.publish && hashFiles('collect/kc-k27.bin') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="macos27-payload-${{ inputs.tag }}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "$tag" \
              --notes "macOS ${{ inputs.tag }} k27 kernel and kernel collection (arm64e, kc27 layout)"
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" collect/kernel-k27.macho collect/kc-k27.bin \
            collect/kc-k27.natives.json --clobber
