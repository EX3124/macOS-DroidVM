name: macos-data-seed

# Build the macOS Data volume seed (scratch-data.img) of the DroidVM boot payload on a Linux
# runner: a case-insensitive APFS volume with the Data UUID the pinned kernel mounts
# (CONFIG_XNU_OWNER_DATA_VOLUME_UUID of device b8e5279: B6E75E79-9594-4B6B-955A-F55B5154990A),
# filled from the 23G93 OS image's /System/Library/Templates/Data (make-macos-data-seed.sh),
# then packed to DarwinBoot's DBRDISK1 format with scripts/packed-ramdisk.py (vendored from
# Droid-VM/DarwinBoot Test/packed_ramdisk.py). The packed seed replaces
# EFI/UniXNU/Payloads/scratch-data.img of the boot disk (mtools, no rebuild needed).
# Uploaded as a plain artifact; also published as the release asset macos-data-seed.

on:
  workflow_dispatch:
    inputs:
      os_disk_run:
        description: macos-disks run id whose os-disk-23G93 artifact to use (empty = latest successful run)
        default: ''
      size_mib:
        description: logical size of the Data volume (MiB)
        default: '2048'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TAG: '23G93'
      DATA_UUID: 'B6E75E79-9594-4B6B-955A-F55B5154990A'
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake rsync openssl libssl-dev
          sudo apt-get install -y "linux-headers-$(uname -r)" || sudo apt-get install -y linux-headers-generic || true
          df -h /

      - name: Sources (pinned trees)
        run: python3 scripts/prepare-sources.py

      - name: Build tools
        run: |
          cmake -S sources/lzfse -B build/lzfse -DCMAKE_BUILD_TYPE=Release
          cmake --build build/lzfse -j "$(nproc)"
          sudo cmake --install build/lzfse
          sudo ldconfig
          make -C sources/apfsprogs/mkapfs -j "$(nproc)"
          make -C sources/linux-apfs-rw -j "$(nproc)"
          ls -la sources/apfsprogs/mkapfs/mkapfs sources/linux-apfs-rw/apfs.ko

      - name: Download the OS disk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${{ inputs.os_disk_run }}"
          if [ -z "$run" ]; then
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow macos-disks.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          echo "macos-disks run: $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" \
            -n os-disk-23G93 -D artifacts
          mv artifacts/os-23G93.raw os-23G93.raw
          df -h /

      - name: Data seed
        run: |
          VOLUME_UUID="$DATA_UUID" bash scripts/make-macos-data-seed.sh \
            sources/apfsprogs sources/linux-apfs-rw/apfs.ko scripts/packed-ramdisk.py \
            os-23G93.raw seed "${{ inputs.size_mib || '2048' }}"
          ls -la seed

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp seed/scratch-data.img scratch-data.img
          if gh release view macos-data-seed -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload macos-data-seed -R "$GITHUB_REPOSITORY" scratch-data.img --clobber
          else
            gh release create macos-data-seed -R "$GITHUB_REPOSITORY" scratch-data.img \
              --title "macOS Data seed (packed)" \
              --notes "scratch-data.img = the macOS 23G93 Data volume seed packed as DarwinBoot's DBRDISK1 (packed-ramdisk.py); replaces EFI/UniXNU/Payloads/scratch-data.img of the boot disk"
          fi

      - name: Upload seed
        uses: actions/upload-artifact@v4
        with:
          name: data-seed-23G93
          path: scratch-data.img
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
