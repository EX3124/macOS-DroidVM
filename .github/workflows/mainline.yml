name: mainline

# Builds the kernel of the DroidVM mainline: Droid-VM/UniXNU-droidvm (device) with Droid-VM/UniXNU, plus the diagnostic XNU
# patches of overlay/droidvm/patches/xnu and the drivers of overlay/droidvm/drivers (virtio-pci). The kernel links Apple
# kexts from the IPSW kernelcache, so binaries are uploaded as plain artifacts (no encryption key).
#
# The device's original-class audits read build/reference-candidate/kernel.{macho,json}, a prelinked kernel of the board
# without its native storage/display drivers. It is kept as the release asset reference-candidate/reference-kernel.tgz;
# when missing (or with rebuild_reference) it is linked first from a reduced copy of the device
# repository (scripts/make-reference-device.py) in the same tree.
#
# Two kernels per run: root=ios (iPadOS 21H461) and root=macos (macOS 14.6.1 23G93 userland on the same kernel and kexts).
# They differ only in the owner root policies baked into the kernel: release root-policies and root-policies-macos.
# The policies job at the top ensures both releases: when one is missing it starts its producer (root-policies.yml, then
# macos-disks.yml, which reuses the owner key of the first) and waits for it before the kernel starts.
#
# The refs default to the last mainline build that linked (2026-11-07, upstream run 42393995268). wip/droidvm and
# wip/hackintosh have since moved to the iPadOS 27 tree: its package/DroidVMGpu.cpp and DroidVMFileExport.c use
# OSMetaClassAdoptSuperclass / droidvm_page_info and friends, whose XNU patches live under ipados27/patches, but this
# 21H461 board only applies patches/xnu (overlay + UniXNU), so the link fails with undefined symbols. Pass the inputs
# to test other refs.

on:
  workflow_dispatch:
    inputs:
      unixnu_repo:
        default: Droid-VM/UniXNU
      unixnu_ref:
        default: baeb8f0cf2143bd84e6076252c7f90345cc6fef6
      device_repo:
        default: Droid-VM/UniXNU-droidvm
      device_ref:
        default: bf7fc44cc3b1a92c842c84aa980993eaa74a2cd8
      rebuild_reference:
        type: boolean
        default: false
      trigger_downstream:
        description: dispatch the other workflows of the repository after this run
        type: boolean
        default: true
  push:
    paths:
      - 'overlay/droidvm/patches/**'
      - 'overlay/droidvm/drivers/**'
      - 'overlay/droidvm/scripts/**'
      - 'scripts/apply-overlay-board.py'
      - 'scripts/ci-root-policies.py'
      - 'scripts/udif-expand.py'
      - '.github/workflows/mainline.yml'
      - 'scripts/make-reference-device.py'
      - 'scripts/owner-policy-dirs.py'
      - 'scripts/mainline-bootstrap-placeholders.py'
      - 'scripts/macos-root-probe.py'

permissions:
  contents: write
  actions: write

jobs:
  # The kernel links the owner policies of the OS/SystemOS disks, so the root-policies (iOS) and root-policies-macos
  # (macOS) releases must exist before it builds. When one is missing this job starts its producer and waits:
  # root-policies.yml generates the owner key and the iOS policies, macos-disks.yml reuses that key for the macOS disks
  # (and commits out/owner/macos-root-pins.json to the branch, which the kernel job then checks out).
  policies:
    name: ensure owner policies
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Ensure the policy releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          has_asset() {
            gh release view "$1" -R "$GH_REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$2"
          }

          wait_run() {
            run=$1 workflow=$2
            echo "waiting for $workflow run $run: https://github.com/$GH_REPO/actions/runs/$run"
            while :; do
              status=$(gh run view "$run" -R "$GH_REPO" --json status --jq '.status')
              if [ "$status" = completed ]; then
                conclusion=$(gh run view "$run" -R "$GH_REPO" --json conclusion --jq '.conclusion')
                if [ "$conclusion" != success ]; then
                  echo "::error::$workflow run $run finished: $conclusion"
                  return 1
                fi
                echo "$workflow run $run: success"
                return 0
              fi
              sleep 30
            done
          }

          start_or_join() {
            workflow=$1
            # Join the run already building these policies on this branch, or start one.
            run=$(gh run list -R "$GH_REPO" --workflow "$workflow" --branch "$REF" --limit 20 \
                    --json databaseId,status --jq '[.[] | select(.status != "completed")][0].databaseId // empty')
            if [ -z "$run" ]; then
              echo "dispatching $workflow on $REF"
              gh workflow run "$workflow" --ref "$REF"
              for _ in $(seq 1 24); do
                sleep 5
                run=$(gh run list -R "$GH_REPO" --workflow "$workflow" --branch "$REF" --limit 1 \
                        --json databaseId,status --jq '[.[] | select(.status != "completed")][0].databaseId // empty')
                if [ -n "$run" ]; then break; fi
              done
            fi
            if [ -z "$run" ]; then
              echo "::error::could not start $workflow"
              return 1
            fi
            wait_run "$run" "$workflow"
          }

          started_root=0
          if ! has_asset root-policies verified-root-inputs.tar.gz; then
            start_or_join root-policies.yml
            has_asset root-policies verified-root-inputs.tar.gz || \
              { echo "::error::root-policies/verified-root-inputs.tar.gz is still missing"; exit 1; }
            started_root=1
          fi

          if [ "$started_root" = 1 ] || ! has_asset root-policies-macos verified-root-inputs.tar.gz || \
             ! gh api "repos/$GH_REPO/contents/out/owner/macos-root-pins.json?ref=$REF" >/dev/null 2>&1; then
            start_or_join macos-disks.yml
            has_asset root-policies-macos verified-root-inputs.tar.gz || \
              { echo "::error::root-policies-macos/verified-root-inputs.tar.gz is still missing"; exit 1; }
          fi

  kernel:
    needs: policies
    runs-on: macos-26
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        root: [ios, macos]
    env:
      BOARD: droidvm
      LABEL: ${{ matrix.root == 'ios' && 'mainline' || 'mainline-macos' }}
      POLICIES: ${{ matrix.root == 'ios' && 'root-policies' || 'root-policies-macos' }}
      POLICIES_SOURCE: ${{ matrix.root == 'ios' && 'root-policies.yml' || 'macos-disks.yml' }}
      UNIXNU_REPO: ${{ inputs.unixnu_repo || 'Droid-VM/UniXNU' }}
      UNIXNU_REF: ${{ inputs.unixnu_ref || 'baeb8f0cf2143bd84e6076252c7f90345cc6fef6' }}
      DEVICE_REPO: ${{ inputs.device_repo || 'Droid-VM/UniXNU-droidvm' }}
      DEVICE_REF: ${{ inputs.device_ref || 'bf7fc44cc3b1a92c842c84aa980993eaa74a2cd8' }}
      REBUILD_REFERENCE: ${{ inputs.rebuild_reference || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          # The policies job may commit out/owner/macos-root-pins.json to this branch while it waits for macos-disks;
          # check out the branch as it is now, not the commit that triggered the run.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld cmake ninja unifdef mtools dtc
          python3 -m pip install --upgrade pip

      - name: Sources
        run: |
          git clone --filter=blob:none "https://github.com/$UNIXNU_REPO.git" UniXNU
          git -C UniXNU checkout "$UNIXNU_REF"
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          git clone --filter=blob:none "https://github.com/$DEVICE_REPO.git" device
          git -C device checkout "$DEVICE_REF"
          git -C device submodule update --init --recursive --filter=blob:none
          # A device patches/xnu replaces the UniXNU one as a module: carry the UniXNU patches beside the overlay.
          mkdir -p device/patches/xnu
          cp ci/overlay/$BOARD/patches/xnu/*.patch device/patches/xnu/
          # Driver modules of the overlay replace the UniXNU ones (a device repository directory wins over the base):
          # NativeVirtioBlock with the virtio-pci transport, for the stock DroidVM crosvm (virtio-pci only).
          mkdir -p device/drivers
          cp -R ci/overlay/$BOARD/drivers/. device/drivers/
          ls device/drivers
          # Archive builders of the overlay (virtio-gpu); apply-overlay-board.py lists them after device-ref is copied.
          cp -R ci/overlay/$BOARD/scripts/. device/scripts/
          cp -n UniXNU/patches/xnu/*.patch device/patches/xnu/
          ls device/patches/xnu
          echo "UNIXNU_COMMIT=$(git -C UniXNU rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEVICE_COMMIT=$(git -C device rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C UniXNU log --oneline -1
          git -C device log --oneline -1
          # The reference device: the same repository without the builders that need the reference candidate.
          cp -R device device-ref
          python3 ci/scripts/make-reference-device.py device-ref "${BOARD}_defconfig"
          python3 ci/scripts/apply-overlay-board.py device "${BOARD}_defconfig"
          mkdir -p device/.cache
          rm -rf device-ref/.cache
          ln -s "$PWD/device/.cache" device-ref/.cache

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-mainline-${{ hashFiles('UniXNU/feeds.toml', 'device/feeds.toml') }}

      - name: Fetch
        working-directory: UniXNU
        run: |
          ./unixnu defconfig "${BOARD}_defconfig" -D ../device
          ./unixnu fetch
          ./unixnu ipsw fetch
          ./unixnu status || true

      - name: Prefetch API listings
        run: |
          sources="UniXNU/out/$BOARD/tree/.cache/sources"
          mkdir -p "$sources"
          api=repos/apple-oss-distributions/xnu/contents
          gh api "$api/iokit/DriverKit?ref=xnu-10063.121.3" > "$sources/xnu-driverkit-10063.121.3.json"
          gh api "$api/iokit/DriverKit/crypto?ref=xnu-10063.121.3" > "$sources/xnu-driverkit-crypto-10063.121.3.json"
          gh api "$api/EXTERNAL_HEADERS/TrustCache?ref=xnu-8796.101.5" > "$sources/xnu-trustcache-8796.101.5.json"

      - name: Owner root policies
        # build/verified-root-{os,systemos} from the owner manifests published as $POLICIES/verified-root-inputs.tar.gz.
        run: |
          inputs="$RUNNER_TEMP/verified-root-inputs"
          mkdir -p "$inputs"
          if ! gh release download "$POLICIES" --repo "$GITHUB_REPOSITORY" \
                 --pattern verified-root-inputs.tar.gz --dir "$RUNNER_TEMP"; then
            echo "::error::release $POLICIES has no verified-root-inputs.tar.gz; run $POLICIES_SOURCE on this branch first"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/verified-root-inputs.tar.gz" -C "$inputs"
          python3 ci/scripts/owner-policy-dirs.py "$inputs" "UniXNU/out/$BOARD/tree" "${{ matrix.root }}"
          if [ "${{ matrix.root }}" = macos ]; then
            python3 ci/scripts/macos-root-probe.py UniXNU/scripts/build-verified-root-probe.py device/scripts/build-verified-root-probe.py
          fi

      - name: Reference candidate
        working-directory: UniXNU
        run: |
          jobs="-j $(sysctl -n hw.ncpu)"
          ref="out/$BOARD/tree/build/reference-candidate"
          mkdir -p "$ref"
          if [ "$REBUILD_REFERENCE" != true ] && gh release download reference-candidate --repo "$GITHUB_REPOSITORY" \
               --pattern reference-kernel.tgz --dir "$RUNNER_TEMP" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/reference-kernel.tgz" -C "$ref"
            echo "reference candidate from the release asset"
          else
            ./unixnu defconfig "${BOARD}_defconfig" -D ../device-ref
            ./unixnu fetch   # writes device-ref/unixnu.lock; the sources are already in out/feeds
            ./unixnu build kernel $jobs
            cp "out/$BOARD/kernel/kernel.macho" "out/$BOARD/kernel/kernel.json" "$ref/"
            tar -czf "$RUNNER_TEMP/reference-kernel.tgz" -C "$ref" kernel.macho kernel.json
            gh release view reference-candidate --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create reference-candidate --repo "$GITHUB_REPOSITORY" --title "reference candidate" \
                --notes "Prelinked DroidVM kernel without native storage/display drivers."
            gh release upload reference-candidate "$RUNNER_TEMP/reference-kernel.tgz" --repo "$GITHUB_REPOSITORY" --clobber
            # The full build starts again from the device repository; its kernel replaces this one.
            mkdir -p "$RUNNER_TEMP/logs-reference"
            cp -R "out/$BOARD/logs/." "$RUNNER_TEMP/logs-reference/" || true
            ./unixnu defconfig "${BOARD}_defconfig" -D ../device
          fi
          ls -la "$ref"

      - name: Build kernel
        working-directory: UniXNU
        run: |
          # On a clean tree (reference candidate from the release asset) the bootstrap pass reads records that only the
          # archive builders write: give it ones for the empty placeholders.
          python3 ../ci/scripts/mainline-bootstrap-placeholders.py "out/$BOARD/tree"
          ./unixnu build kernel -j "$(sysctl -n hw.ncpu)"

      - name: Collect
        if: always()
        run: |
          board="UniXNU/out/$BOARD"
          mkdir -p collect
          [ -d "$board/logs" ] && cp -R "$board/logs" collect/logs || true
          [ -d "$RUNNER_TEMP/logs-reference" ] && cp -R "$RUNNER_TEMP/logs-reference" collect/logs-reference || true
          printf 'unixnu %s %s\ndevice %s %s\n' "$UNIXNU_REPO" "$UNIXNU_COMMIT" "$DEVICE_REPO" "$DEVICE_COMMIT" > collect/sources.txt
          cp collect/sources.txt collect/logs/ 2>/dev/null || true
          if [ -d "$board/tree/build" ]; then
            (cd "$board/tree" && find build -maxdepth 4 \( -name '*.a' -o -name 'mach.*' -o -name '*.json' \) -type f -size -400M \
               -not -path 'build/reference-candidate/*' | tar -cf - -T -) > collect/build.tar || true
          fi
          [ -d "$board/kernel" ] && tar -czf kernel.tgz -C "$board" kernel || true
          [ -s collect/build.tar ] && gzip -c collect/build.tar > build.tgz || true
          ls -la collect *.tgz || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.LABEL }}
          path: |
            collect/logs
            collect/logs-reference
            collect/sources.txt
          if-no-files-found: ignore

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.LABEL }}
          path: kernel.tgz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.LABEL }}
          path: build.tgz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  # One pipeline per mainline run: when the kernel job is over, start the other workflows of the repository. The files
  # under .github/workflows are enumerated, so a new workflow is picked up without editing this job; the ones that must
  # stay manual (or that the policies job starts on demand) are skipped below.
  dispatch:
    name: dispatch other workflows
    needs: [policies, kernel]
    if: ${{ always() && needs.policies.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.trigger_downstream) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github/workflows

      - name: Start the other workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          KERNEL_RESULT: ${{ needs.kernel.result }}
          KERNEL_RUN: ${{ github.run_id }}
        run: |
          # Manual only (and skipped below): mainline.yml is this run; kernel.yml is the legacy baseline build of
          # device/UniXNU-droidvm (its header says manual only); bootstrap.yml is the one-shot import of the upstream
          # macOS branch; quick-publish.yml publishes an artifact and tag chosen by hand (required inputs).
          # root-policies.yml rotates the owner key, so only the policies job starts it, and only when its release is
          # missing (macos-disks.yml stays here: it refreshes the disks and reuses the existing owner key).
          skip=" mainline.yml kernel.yml bootstrap.yml quick-publish.yml root-policies.yml "
          # These consume this run's artifacts (publish-release) or published releases (bootdisk-build): not started
          # when the kernel job failed.
          after_success=" publish-release.yml bootdisk-build.yml "
          declare -A inputs=( [publish-release.yml]="-f kernel_run=$KERNEL_RUN" )
          failed=0
          for path in ci/.github/workflows/*.yml; do
            workflow=$(basename "$path")
            case "$skip" in *" $workflow "*) echo "skip $workflow (manual only)"; continue;; esac
            case "$after_success" in
              *" $workflow "*)
                if [ "$KERNEL_RESULT" != success ]; then
                  echo "skip $workflow (kernel build: $KERNEL_RESULT)"
                  continue
                fi;;
            esac
            echo "::group::dispatch $workflow"
            # shellcheck disable=SC2086  # the extra inputs are separate -f arguments
            if gh workflow run "$workflow" --ref "$REF" ${inputs[$workflow]-}; then
              echo "dispatched $workflow"
            else
              echo "::warning::could not dispatch $workflow"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::warning::$failed workflow(s) not dispatched"
          fi
